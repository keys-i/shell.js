name: Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm run build
      - run: npm run browser
        env:
          CHROMIUM_BIN: /usr/bin/chromium
      - run: npm run benchmark:ci
        env:
          BENCH_ROUNDS: 250
      - run: git diff --exit-code -- javascripts/shell.min.js wasm/shell.wasm
