<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; connect-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'"
    />
    <title>shell.js demo</title>
    <link rel="stylesheet" href="./demo.css" />
  </head>
  <body>
    <header>
      <span>@keys-i/shell.js playground</span>
      <label>
        Profile
        <select id="profile">
          <option value="freebsd">FreeBSD / amd64</option>
          <option value="linux">Linux / x86_64</option>
        </select>
      </label>
      <label>
        CPU
        <select id="cpu">
          <option value="x86">x86-64</option>
          <option value="arm">AArch64</option>
        </select>
      </label>
      <a href="https://github.com/keys-i/shell.js">source</a>
    </header>
    <main id="shell">
      <output role="log"></output>
      <form>
        <label>
          <span data-shell-prompt></span>
          <input aria-label="Command" autocomplete="off" spellcheck="false" />
        </label>
      </form>
    </main>
    <script src="../javascripts/shell.min.js"></script>
    <script type="module" src="./demo.js"></script>
  </body>
</html>
