<!doctype html>
<meta charset="utf-8">
<title>shell.js browser conformance</title>
<main id="shell">
  <output role="log"></output>
  <form>
    <label><span data-shell-prompt></span><input aria-label="Command"></label>
  </form>
</main>
<section id="teardown">
  <output role="log">preserved</output>
  <form>
    <label><span data-shell-prompt></span><input aria-label="Delayed command"></label>
  </form>
</section>
<button id="sentinel" type="button">sentinel</button>
<script>window.fixtureStart = performance.now()</script>
<script src="/javascripts/shell.min.js"></script>
<script type="module">
  const assert = (value, message) => {
    if (!value) throw new Error(message);
  };
  const delay = (milliseconds = 0) => new Promise((resolve) => setTimeout(resolve, milliseconds));
  const until = async (condition, message) => {
    for (let attempt = 0; attempt < 100; attempt++) {
      if (condition()) return;
      await delay(10);
    }
    throw new Error(message);
  };
  const key = (target, value, options = {}) =>
    target.dispatchEvent(new KeyboardEvent("keydown", { bubbles: true, cancelable: true, key: value, ...options }));

  window.browserReport = (async () => {
    assert(typeof ShellJS?.createShell === "function", "classic global missing");
    assert(typeof ShellJS.createKradAdd === "function", "Krad command missing");
    const esm = await import("/javascripts/index.js");
    assert(typeof esm.createShell === "function", "ES module missing");
    assert(typeof esm.createKradAdd === "function", "ES module Krad command missing");
    assert((await esm.createShell().exec("echo esm")).stdout === "esm\n", "ES module command failed");
    const coldMs = performance.now() - window.fixtureStart;

    const root = document.querySelector("#shell");
    const form = root.querySelector("form");
    const input = root.querySelector("input");
    const output = root.querySelector("output");
    const rendered = [];
    const shell = ShellJS.createShell({
      profile: "freebsd",
      limits: { maxRuntimeMs: 2_000 },
      commands: {
        hang: () => new Promise(() => {}),
        "krad-add": ShellJS.createKradAdd(),
      },
      manuals: { base: "/missing/" },
    });
    const ui = ShellJS.mountShell(root, shell, {
      promptText: "rad@recv # ",
      render(entry, context) {
        assert(context.root === root && context.shell === shell, "custom render context failed");
        rendered.push(entry);
        const line = document.createElement("pre");
        line.textContent = entry.stdout + entry.stderr;
        output.append(line);
      },
    });
    const submit = async (command) => {
      const count = rendered.length;
      input.value = command;
      form.dispatchEvent(new Event("submit", { bubbles: true, cancelable: true }));
      await until(() => rendered.length > count, `${command} did not render`);
      return rendered.at(-1);
    };

    assert((await submit("echo koala")).stdout === "koala\n", "submit failed");
    key(input, "ArrowUp");
    assert(input.value === "echo koala", "history up failed");
    key(input, "ArrowDown");
    assert(input.value === "", "history down failed");
    assert((await submit("krad-add 20 22")).stdout === "42\n", "Krad command failed");
    input.value = "unam";
    key(input, "Tab");
    assert(input.value === "uname", "completion failed");
    assert((await submit("man cat")).stderr.includes("manual request failed: 404"), "manual failure was hidden");

    input.value = "hang";
    form.dispatchEvent(new Event("submit", { bubbles: true, cancelable: true }));
    await until(() => input.readOnly, "running command did not lock input");
    key(input, "c", { ctrlKey: true });
    await until(() => rendered.at(-1)?.command === "hang", "Ctrl-C did not render");
    assert(rendered.at(-1).code === 130 && !input.readOnly, "Ctrl-C did not abort cleanly");
    ui.destroy();

    const delayedRoot = document.querySelector("#teardown");
    const delayedForm = delayedRoot.querySelector("form");
    const delayedInput = delayedRoot.querySelector("input");
    const delayedOutput = delayedRoot.querySelector("output");
    let finish;
    let signal;
    let prompts = 0;
    let lateRenders = 0;
    const delayed = ShellJS.mountShell(
      delayedRoot,
      {
        complete: () => [],
        exec: (_command, options) => {
          signal = options.signal;
          return new Promise((resolve) => {
            finish = resolve;
          });
        },
      },
      {
        prompt: () => {
          prompts++;
          return "> ";
        },
        render: () => lateRenders++,
      },
    );
    delayedInput.value = "clear";
    delayedForm.dispatchEvent(new Event("submit", { bubbles: true, cancelable: true }));
    await until(() => Boolean(finish), "delayed command did not start");
    const promptCount = prompts;
    delayed.destroy();
    delayed.destroy();
    assert(signal.aborted && !delayedInput.readOnly, "destroy did not synchronously restore input");
    document.querySelector("#sentinel").focus();
    finish({ code: 0, stdout: "late\n", stderr: "" });
    await delay();
    assert(lateRenders === 0 && delayedOutput.textContent === "preserved", "destroy allowed late output");
    assert(prompts === promptCount && document.activeElement.id === "sentinel", "destroy allowed late focus or prompt");
    const detachedSubmit = new Event("submit", { bubbles: true, cancelable: true });
    detachedSubmit.preventDefault();
    delayedForm.dispatchEvent(detachedSubmit);
    key(delayedInput, "l", { ctrlKey: true });
    await delay();
    assert(delayedOutput.textContent === "preserved", "destroy left listeners attached");

    const worker = new Worker("/tools/scripts/worker.fixture.js");
    const workerResult = await new Promise((resolve, reject) => {
      const timeout = setTimeout(() => reject(new Error("worker timed out")), 5_000);
      worker.onmessage = ({ data }) => {
        clearTimeout(timeout);
        resolve(data);
      };
      worker.onerror = ({ message }) => reject(new Error(message));
    });
    worker.terminate();
    assert(workerResult.ready === true, `worker Wasm failed: ${workerResult.error ?? "unknown error"}`);

    const benchmark = esm.createShell();
    const started = performance.now();
    for (let command = 0; command < 50; command++) await benchmark.exec("true");
    await new Promise((resolve) =>
      document.readyState === "complete" ? resolve() : addEventListener("load", resolve, { once: true }),
    );
    return {
      coldMs,
      navigationMs: performance.getEntriesByType("navigation")[0]?.duration ?? 0,
      userAgent: navigator.userAgent,
      warmCommandMs: (performance.now() - started) / 50,
    };
  })().then(
    (metrics) => ({ metrics, ok: true }),
    (error) => ({ error: error.message, ok: false, stack: error.stack }),
  );
</script>
